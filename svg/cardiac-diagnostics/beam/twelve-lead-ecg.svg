<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="12-Lead ECG"><title>12-Lead ECG</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><g transform="translate(-1 -2) scale(0.75)"><path d="M15 6 L20 9 H28 L33 6 L41 13 L35 20 L34 41 H14 L13 20 L7 13 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M20 10 Q24 16 28 10" fill="none" stroke="currentColor" stroke-width="2.1"/></g><rect x="27" y="27" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M30 36 H33 L35 31 L38 38 L40 34 H42" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M12 20 L28 31 M18 22 L28 34 M24 20 L28 28" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="12" cy="20" r="1.2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="18" cy="22" r="1.2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="24" cy="20" r="1.2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="22" cy="15" r="1.2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="17" cy="14" r="1.2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="10" cy="15" r="1.2" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M30 36 H33 L35 31 L38 38 L40 34 H42" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M30 36 H33 L35 31 L38 38 L40 34 H42" pathLength="100" stroke-width="2.3"/></g></svg>
