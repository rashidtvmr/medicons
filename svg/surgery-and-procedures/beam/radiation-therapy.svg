<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Radiation Therapy"><title>Radiation Therapy</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M7 41 V14 L16 6 H30 L35 13 L29 18 L25 13 H20 L15 19 V41 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="27" y="17" width="11" height="7" rx="1" transform="rotate(-35 32 20)" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M19 35 H42 V40 H19 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="22" cy="31" r="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M26 33 H38 M36 41 V44 M27 23 L30 31 M33 23 L32 31" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M30 23 L32 32" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M30 23 L32 32" pathLength="100" stroke-width="2.3"/></g></svg>
