<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Angioplasty / Stent"><title>Angioplasty / Stent</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M5 13 H17 L22 18 H28 L33 13 H43 V35 H33 L28 30 H22 L17 35 H5 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="14" y="20" width="24" height="8" rx="4" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M19 21 L22 27 M25 21 L28 27 M31 21 L34 27" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M4 24 H14" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M5 24 H42" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M5 24 H42" pathLength="100" stroke-width="2.3"/></g></svg>
