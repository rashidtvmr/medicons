<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Kidneys"><title>Kidneys</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><g transform="translate(0 5) scale(0.73)"><path d="M26 8 C17 3 8 11 8 24 C8 38 18 44 26 38 C32 34 27 29 23 29 C19 29 17 27 17 24 C17 20 19 18 23 18 C29 18 31 12 26 8 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M23 12 C16 10 12 17 12 24 C12 32 16 37 22 35" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g transform="translate(48 5) scale(-0.73 0.73)"><path d="M26 8 C17 3 8 11 8 24 C8 38 18 44 26 38 C32 34 27 29 23 29 C19 29 17 27 17 24 C17 20 19 18 23 18 C29 18 31 12 26 8 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M23 12 C16 10 12 17 12 24 C12 32 16 37 22 35" fill="none" stroke="currentColor" stroke-width="2.1"/></g><path d="M18 23 C22 23 20 32 21 39 M30 23 C26 23 28 32 27 39" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M18 20 C23 25 19 31 21 39" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M18 20 C23 25 19 31 21 39" pathLength="100" stroke-width="2.3"/></g></svg>
