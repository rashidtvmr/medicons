<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Operation Theatre"><title>Operation Theatre</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M24 4 V10" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M14 14 L18 9 H30 L34 14 L31 20 H17 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M19 15 H29" fill="none" stroke="currentColor" stroke-width="2.1"/><g transform="translate(0 7) scale(0.9)"><rect x="5" y="26" width="38" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M6 20 L6 39 M42 27 L42 39 M6 36 H42" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="10" cy="41" r="2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="38" cy="41" r="2" fill="none" stroke="currentColor" stroke-width="2.1"/></g><circle cx="12" cy="25" r="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M16 29 L18 23 H29 L35 29 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M43 24 V42 M39 25 H43" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M18 14 H30" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M18 14 H30" pathLength="100" stroke-width="2.3"/></g></svg>
