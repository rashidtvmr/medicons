<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="IVF"><title>IVF</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><ellipse cx="24" cy="32" rx="18" ry="10" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M7 32 C10 42 38 42 41 32" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="22" cy="30" r="5" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="29" cy="29" r="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M32 5 L38 9 L28 25 L24 23 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M32 11 L34 12" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M26 25 L24 28" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M35 8 L26 24 L24 28" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M35 8 L26 24 L24 28" pathLength="100" stroke-width="2.3"/></g></svg>
