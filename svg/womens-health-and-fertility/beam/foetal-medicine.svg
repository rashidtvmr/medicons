<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Foetal Medicine"><title>Foetal Medicine</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><g transform="translate(-1 0) scale(0.84)"><path d="M20 7 C32 5 41 13 40 25 C39 38 28 45 17 40 C7 37 5 27 8 17 C10 11 15 8 20 7 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="25" cy="20" r="5" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M21 25 C16 25 15 34 22 35 C28 36 33 30 29 28 M19 30 L25 31 M25 24 L29 28 M33 15 C37 23 33 32 29 34" fill="none" stroke="currentColor" stroke-width="2.1"/></g><rect x="32" y="19" width="10" height="16" rx="2" transform="rotate(20 37 27)" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M39 20 C39 12 44 13 44 7" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M33 25 L41 28" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M34 31 L20 27 L28 20" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M34 31 L20 27 L28 20" pathLength="100" stroke-width="2.3"/></g></svg>
