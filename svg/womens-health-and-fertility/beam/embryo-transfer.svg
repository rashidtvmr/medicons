<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Embryo Transfer"><title>Embryo Transfer</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M18 17 C21 13 27 13 30 17 C33 23 28 28 27 32 L27 41 L21 41 L21 32 C20 28 15 23 18 17 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M18 18 C13 8 5 10 6 18 M30 18 C35 8 43 10 42 18" fill="none" stroke="currentColor" stroke-width="2.1"/><ellipse cx="10" cy="21" rx="4" ry="3" fill="none" stroke="currentColor" stroke-width="2.1"/><ellipse cx="38" cy="21" rx="4" ry="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M23 20 C21 23 23 26 24 29 C25 26 27 23 25 20 M24 31 L24 39" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M43 41 H33 C28 41 24 36 24 29" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M24 29 V22" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="24" cy="21" r="1.5" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M43 41 H33 C28 41 24 36 24 29 V22" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M43 41 H33 C28 41 24 36 24 29 V22" pathLength="100" stroke-width="2.3"/></g></svg>
