<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Speech Therapy"><title>Speech Therapy</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M12 6 C24 4 30 15 25 21 L30 25 L24 28 V33 H17 V42 H5 V23 C2 16 4 9 12 6 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M21 18 H23 M20 28 H24" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M34 19 Q38 24 34 29 M39 14 Q46 24 39 34" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M34 19 Q38 24 34 29" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M34 19 Q38 24 34 29" pathLength="100" stroke-width="2.3"/></g></svg>
