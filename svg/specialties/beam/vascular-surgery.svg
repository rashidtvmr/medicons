<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Vascular Surgery"><title>Vascular Surgery</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><g transform="translate(-1 0) scale(0.85)"><path d="M14 5 L22 5 L22 19 L33 8 L39 14 L25 28 L25 43 L16 43 L16 25 L6 15 L12 9 L17 14 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M18 8 L18 19 L10 13 M20 38 L20 26 L34 12" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g transform="translate(20 19) scale(0.54)"><path d="M31 7 L39 13 L23 30 L18 25 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M17 26 L22 31 L10 43 C5 40 7 35 10 32 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M30 12 L33 15" fill="none" stroke="currentColor" stroke-width="2.1"/></g></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M14 8 V19 L21 27 V37" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M14 8 V19 L21 27 V37" pathLength="100" stroke-width="2.3"/></g></svg>
