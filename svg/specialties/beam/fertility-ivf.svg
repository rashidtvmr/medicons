<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Fertility / IVF"><title>Fertility / IVF</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><circle cx="20" cy="25" r="14" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="20" cy="25" r="9" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="18" cy="24" r="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M29 18 L39 7 M35 8 L40 13 M39 6 L43 10" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M41 7 L29 19 L22 25" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M41 7 L29 19 L22 25" pathLength="100" stroke-width="2.3"/></g></svg>
