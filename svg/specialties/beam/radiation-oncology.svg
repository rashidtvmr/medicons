<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Radiation Oncology"><title>Radiation Oncology</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><circle cx="24" cy="26" r="9" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="24" cy="26" r="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M5 12 L10 5 L20 17 L16 20 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M38 6 L43 12 L31 20 L28 16 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M21 38 L27 38 L28 44 H20 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M12 15 L17 21 M37 15 L31 21 M24 35 V40" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M9 8 L24 26 L40 10" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M9 8 L24 26 L40 10" pathLength="100" stroke-width="2.3"/></g></svg>
