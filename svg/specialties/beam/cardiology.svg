<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Cardiology"><title>Cardiology</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><g transform="translate(2 0) scale(0.86)"><path d="M23 12 C19 6 9 10 8 20 C6 31 17 40 26 42 C33 36 40 29 39 21 C39 15 35 11 29 12 L29 6 L24 6 L24 12 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M17 12 L15 7 L19 5 L22 11" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M25 15 C20 18 20 24 25 30 C27 33 29 35 29 38 M22 23 L15 24 M25 29 L33 26 M25 16 L32 17" fill="none" stroke="currentColor" stroke-width="2.1"/></g><path d="M23 35 H28 L31 28 L35 40 L38 34 H44" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M24 35 H28 L31 28 L35 40 L38 34 H44" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M24 35 H28 L31 28 L35 40 L38 34 H44" pathLength="100" stroke-width="2.3"/></g></svg>
