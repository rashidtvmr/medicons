<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Blood Donation"><title>Blood Donation</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M24 5 C14 18 13 22 13 26 C13 39 35 39 35 26 C35 22 32 17 24 5 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M18 26 Q18 32 23 32" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M5 36 L12 42 H35 L43 36 M12 42 L12 44 M35 42 L35 44" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M24 9 C18 18 16 23 18 28" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M24 9 C18 18 16 23 18 28" pathLength="100" stroke-width="2.3"/></g></svg>
