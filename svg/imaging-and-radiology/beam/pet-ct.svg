<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="PET-CT"><title>PET-CT</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M7 29 V19 C7 2 39 2 39 19 V29 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><ellipse cx="23" cy="20" rx="9" ry="11" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M21 27 L30 27 L42 39 L13 39 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M15 39 V43 M39 39 V43" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M23 30 L31 36 M10 25 H12" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="22" cy="19" r="4" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M22 15 V23 M18 19 H26" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M42 8 V15 M38 11 H45" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M14 20 C14 5 32 5 32 20 C32 26 28 30 24 31" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M14 20 C14 5 32 5 32 20 C32 26 28 30 24 31" pathLength="100" stroke-width="2.3"/></g></svg>
