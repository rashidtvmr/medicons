<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="X-Ray Machine"><title>X-Ray Machine</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M12 5 V42 M5 43 H20 M12 10 H32" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="29" y="6" width="11" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M32 15 H37" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M25 23 L20 30 M34 23 L39 30" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M22 34 H40 L43 39 H19 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M23 39 V44 M38 39 V44" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M34 20 L25 32" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M34 20 L25 32" pathLength="100" stroke-width="2.3"/></g></svg>
