<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="MRI Scanner"><title>MRI Scanner</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M7 29 V19 C7 5 19 4 28 5 L37 9 C43 14 42 22 40 29 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><ellipse cx="19" cy="20" rx="8" ry="11" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M16 27 H24 L37 40 H7 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M10 40 V44 M34 40 V44" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M31 11 C36 14 37 21 35 25 M19 30 L26 37" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M11 21 C11 7 27 7 27 21" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M11 21 C11 7 27 7 27 21" pathLength="100" stroke-width="2.3"/></g></svg>
