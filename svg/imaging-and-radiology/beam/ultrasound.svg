<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ultrasound"><title>Ultrasound</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><rect x="5" y="6" width="28" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M11 12 L9 22 Q19 27 29 22 L26 12 M13 18 Q19 15 25 19" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M8 30 H31 L34 37 H5 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M10 37 V43 M28 37 V43 M33 15 C44 12 40 29 42 30" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="37" y="29" width="7" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M19 12 L10 22 Q19 27 28 22 L19 12" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M19 12 L10 22 Q19 27 28 22 L19 12" pathLength="100" stroke-width="2.3"/></g></svg>
