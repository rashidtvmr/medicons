<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="C-Arm"><title>C-Arm</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M33 8 C16 2 5 14 10 27 C13 35 22 38 31 35 L29 29 C21 32 16 27 15 22 C13 14 21 10 29 14 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="28" y="5" width="11" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="27" y="28" width="11" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M7 23 H3 V40 H18 M23 22 H44 M38 22 V43" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M33 8 V12 M30 32 H35" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M30 11 C11 2 6 34 30 32" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M30 11 C11 2 6 34 30 32" pathLength="100" stroke-width="2.3"/></g></svg>
