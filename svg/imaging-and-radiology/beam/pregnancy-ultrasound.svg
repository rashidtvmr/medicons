<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Pregnancy Ultrasound"><title>Pregnancy Ultrasound</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><rect x="5" y="5" width="38" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M24 10 L12 27 Q24 34 36 27 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="25" cy="19" r="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M22 22 C17 24 21 29 26 27 L28 24 M18 40 H30 M24 36 V40" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M24 11 L13 27 Q24 32 35 27" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M24 11 L13 27 Q24 32 35 27" pathLength="100" stroke-width="2.3"/></g></svg>
