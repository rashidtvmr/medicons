<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Oxygen Therapy"><title>Oxygen Therapy</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><g transform="translate(-4 1) scale(0.87)"><rect x="15" y="12" width="18" height="31" rx="5" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="19" y="6" width="10" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M24 6 V3 M19 3 H29" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M20 19 L28 19 M20 36 H28" fill="none" stroke="currentColor" stroke-width="2.1"/></g><path d="M36 5 C44 6 45 15 41 19 L44 23 L40 25 V31 H34 V39" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M38 15 H40" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M19 10 C25 5 29 22 37 23 M34 21 L36 25 M38 21 V25" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M18 10 C25 5 29 22 37 23" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M18 10 C25 5 29 22 37 23" pathLength="100" stroke-width="2.3"/></g></svg>
