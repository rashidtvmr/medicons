<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Sleep Study"><title>Sleep Study</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><g transform="translate(-1 6) scale(0.92)"><rect x="5" y="26" width="38" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M6 20 L6 39 M42 27 L42 39 M6 36 H42" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="10" cy="41" r="2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="38" cy="41" r="2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="13" cy="21" r="4" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M18 25 L18 19 L29 19 C34 19 37 22 38 26 Z" fill="none" stroke="currentColor" stroke-width="2.1"/></g><rect x="26" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M29 12 H31 L33 8 L35 15 L38 10 H41" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M30 18 C24 21 21 20 13 28" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="13" cy="27" r="1.5" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M8 8 H14 L8 15 H14" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M29 12 H31 L33 8 L35 15 L38 10 H41" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M29 12 H31 L33 8 L35 15 L38 10 H41" pathLength="100" stroke-width="2.3"/></g>