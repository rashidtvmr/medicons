<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Heart-Lung Machine"><title>Heart-Lung Machine</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><rect x="6" y="27" width="36" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M10 36 H38" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="14" cy="26" r="6" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="33" cy="26" r="6" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M14 22 L14 27 L17 29 M33 22 L33 27 L36 29" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M10 41 V44 M38 41 V44 M8 22 C3 10 13 4 21 7 M39 22 C45 10 35 4 27 7" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="19" y="5" width="10" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M22 8 L26 14 M26 8 L22 14" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M8 22 C3 10 13 4 21 7 M27 7 C35 4 45 10 39 22" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M8 22 C3 10 13 4 21 7 M27 7 C35 4 45 10 39 22" pathLength="100" stroke-width="2.3"/></g></svg>
