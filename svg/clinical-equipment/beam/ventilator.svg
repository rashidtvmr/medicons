<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ventilator"><title>Ventilator</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><rect x="8" y="7" width="27" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M12 21 H16 L19 14 L23 25 L27 18 H31 M13 27 H17 M27 27 H30" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M21 32 V40 M11 42 H32 M35 14 C44 12 43 26 41 29 L37 31" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="11" cy="43" r="1.8" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="32" cy="43" r="1.8" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M12 21 H16 L19 14 L23 25 L27 18 H31" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M12 21 H16 L19 14 L23 25 L27 18 H31" pathLength="100" stroke-width="2.3"/></g></svg>
