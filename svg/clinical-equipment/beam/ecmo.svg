<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="ECMO"><title>ECMO</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><circle cx="12" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M6 19 Q12 14 18 19 V39 H6 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="30" y="7" width="12" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M33 10 L39 21 M39 10 L33 21" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="34" cy="36" r="7" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M34 32 V36 L38 38" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M18 23 C25 23 20 7 30 10 M40 25 L39 30 M27 36 C22 36 25 30 18 30" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M18 23 C25 23 20 7 30 10 M40 25 L39 30 M27 36 C22 36 25 30 18 30" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M18 23 C25 23 20 7 30 10 M40 25 L39 30 M27 36 C22 36 25 30 18 30" pathLength="100" stroke-width="2.3"/></g></svg>
