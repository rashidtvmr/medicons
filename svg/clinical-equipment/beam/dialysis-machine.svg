<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Dialysis Machine"><title>Dialysis Machine</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><rect x="12" y="5" width="25" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="17" y="10" width="15" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M18 16 H21 L24 12 L27 17 H30" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="20" cy="28" r="4" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="30" cy="28" r="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M17 40 V43 M32 40 V43 M12 13 C4 10 4 33 11 31 M37 24 C45 23 43 35 38 34" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M12 13 C4 10 4 33 11 31" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M12 13 C4 10 4 33 11 31" pathLength="100" stroke-width="2.3"/></g></svg>
