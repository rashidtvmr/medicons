<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Infusion Pump"><title>Infusion Pump</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M13 4 V42 M5 43 H22 M8 6 H26" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="15" y="9" width="10" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M18 16 H22" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="20" y="25" width="22" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M24 29 H33 V35 H24 Z M37 29 V33" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M20 21 V24 M33 40 C33 44 42 44 43 39" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M20 20 V24 M33 40 C33 44 42 44 43 39" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M20 20 V24 M33 40 C33 44 42 44 43 39" pathLength="100" stroke-width="2.3"/></g></svg>
