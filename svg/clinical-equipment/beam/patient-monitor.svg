<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Patient Monitor"><title>Patient Monitor</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><rect x="6" y="6" width="36" height="27" rx="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M10 22 H17 L20 15 L25 27 L29 19 H38" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M24 34 L24 40 M15 41 L33 41" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M10 22 H17 L20 15 L25 27 L29 19 H38" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M10 22 H17 L20 15 L25 27 L29 19 H38" pathLength="100" stroke-width="2.3"/></g></svg>
