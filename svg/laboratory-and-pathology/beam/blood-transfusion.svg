<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Blood Transfusion"><title>Blood Transfusion</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><rect x="9" y="5" width="21" height="25" rx="4" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M14 10 H25" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M20 13 C14 20 15 24 20 24 C25 24 26 20 20 13 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M20 31 V35 C20 42 40 43 40 34 V29" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="36" y="23" width="8" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M20 29 V35 C20 42 40 43 40 34 V29" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M20 29 V35 C20 42 40 43 40 34 V29" pathLength="100" stroke-width="2.3"/></g></svg>
