<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Emergency Ventilation"><title>Emergency Ventilation</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M27 29 C28 18 43 19 43 29 C44 37 39 40 33 39 L27 43 H17 L22 36 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M27 23 L35 27 L33 33 L23 30 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><ellipse cx="17" cy="16" rx="10" ry="7" transform="rotate(25 17 16)" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M25 20 L29 25 M7 12 L4 10" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M12 12 L22 17 M33 33 L38 32" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M8 12 L25 20 L30 27" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M8 12 L25 20 L30 27" pathLength="100" stroke-width="2.3"/></g></svg>
