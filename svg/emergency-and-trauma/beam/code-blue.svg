<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Code Blue"><title>Code Blue</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><rect x="5" y="5" width="38" height="28" rx="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M9 22 H15 L18 15 L23 27 L28 11 L32 22 H39" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M10 34 V43 M38 34 V43 M11 38 H37" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="20" cy="40" r="2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="28" cy="40" r="2" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M9 22 H15 L18 15 L23 27 L28 11 L32 22 H39" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M9 22 H15 L18 15 L23 27 L28 11 L32 22 H39" pathLength="100" stroke-width="2.3"/></g></svg>
