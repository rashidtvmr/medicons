<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Neonatal Incubator"><title>Neonatal Incubator</title><style>@keyframes hmi-flow{to{stroke-dashoffset:-100}}.hmi-beam-tail,.hmi-beam-head{animation:hmi-flow var(--hmi-duration,2.6s) linear infinite;animation-play-state:var(--hmi-play-state,running)}.hmi-beam-tail{stroke-dasharray:20 80;opacity:.22}.hmi-beam-head{stroke-dasharray:7 93}@media(prefers-reduced-motion:reduce){.hmi-beam-tail,.hmi-beam-head{animation:none;display:none}.hmi-beam-base{opacity:1}}</style><g class="hmi-beam-base" opacity="0.48"><path d="M9 24 V17 C9 8 39 8 39 17 V24 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><rect x="6" y="24" width="36" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M12 32 V40 M36 32 V40 M10 40 H38" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="12" cy="42" r="2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="36" cy="42" r="2" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="18" cy="20" r="3" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M22 23 L22 18 Q31 16 33 23 Z" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M13 17 L15 14 M34 14 L36 17" fill="none" stroke="currentColor" stroke-width="2.1"/></g><g fill="none" stroke="var(--hmi-beam-color, currentColor)"><path class="hmi-beam-tail" d="M12 15 C15 9 33 9 37 15" pathLength="100" stroke-width="3.8"/><path class="hmi-beam-head" d="M12 15 C15 9 33 9 37 15" pathLength="100" stroke-width="2.3"/></g></svg>
